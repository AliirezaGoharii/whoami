<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="zcTitle zcDesc" class="shot">
<title id="zcTitle">ZenithCrypto dashboard</title>
<desc id="zcDesc">A dark financial dashboard showing a rising portfolio chart, market prices, and crypto holdings.</desc>
<defs>
